name: Generate Audio

on:
  repository_dispatch:
    types: [generate-audio]
  workflow_dispatch:
    inputs:
      mockId:
        description: "Mock ID to generate audio for"
        required: true
        type: string

jobs:
  audio:
    runs-on: ubuntu-latest
    env:
      MOCK_ID: ${{ github.event.inputs.mockId || github.event.client_payload.mockId }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch mock payload from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: node scripts/d1-read.mjs "$MOCK_ID" > /tmp/mock.json

      - name: Write Google credentials
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          if [ -z "$GOOGLE_TTS_KEY" ]; then
            echo "Missing GOOGLE_TTS_KEY repository secret"; exit 1
          fi
          printf '%s' "$GOOGLE_TTS_KEY" > /tmp/gcp-tts.json

      - name: Generate audio
        env:
          AUDIO_BASE_URL: ${{ secrets.AUDIO_BASE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-tts.json
        run: node scripts/generate-mock-audio.mjs /tmp/mock.json /tmp/audio

      # A mock with no listening sections (or none with "SPEAKER: text" lines) has
      # nothing to upload — that is not a failure, it still gets an empty manifest.
      - name: Upload MP3s to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shopt -s nullglob
          files=(/tmp/audio/*.mp3)
          if [ ${#files[@]} -eq 0 ]; then
            echo "$MOCK_ID produced no listening audio — skipping upload."
            exit 0
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            npx wrangler r2 object put "linguaband-audio/${MOCK_ID}/${name}" --file "$f" --remote --cache-control "public, max-age=31536000, immutable"
          done

      - name: Verify MP3s reached remote R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shopt -s nullglob
          files=(/tmp/audio/*.mp3)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nothing to verify."
            exit 0
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            bytes=$(npx wrangler r2 object get "linguaband-audio/${MOCK_ID}/${name}" --remote --pipe | wc -c)
            if [ "$bytes" -eq 0 ]; then
              echo "FAILED: ${name} was not uploaded to remote R2"
              exit 1
            fi
            echo "OK: ${name} (${bytes} bytes)"
          done

      - name: Publish manifest to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: node scripts/d1-write.mjs "$MOCK_ID" /tmp/audio/manifest.json

      # Keeps /admin truthful: a failed run shows "failed" (with a Retry button)
      # instead of waiting forever on "generating".
      - name: Mark mock as failed in D1
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          if [ -n "$MOCK_ID" ]; then
            node scripts/d1-status.mjs "$MOCK_ID" failed || echo "could not record the failure in D1"
          fi

name: Generate Practice Audio

on:
  repository_dispatch:
    types: [generate-practice-audio]
  workflow_dispatch:
    inputs:
      trackId:
        description: "Listening practice track ID to generate audio for"
        required: true
        type: string

jobs:
  audio:
    runs-on: ubuntu-latest
    env:
      TRACK_ID: ${{ github.event.inputs.trackId || github.event.client_payload.trackId }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch listening practice track from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: node scripts/d1-practice-read.mjs "$TRACK_ID" > /tmp/track.json

      - name: Write Google credentials
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          if [ -z "$GOOGLE_TTS_KEY" ]; then
            echo "Missing GOOGLE_TTS_KEY repository secret"; exit 1
          fi
          printf '%s' "$GOOGLE_TTS_KEY" > /tmp/gcp-tts.json

      - name: Generate practice audio
        env:
          AUDIO_BASE_URL: ${{ secrets.AUDIO_BASE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-tts.json
        run: node scripts/generate-practice-audio.mjs /tmp/track.json /tmp/audio

      - name: Upload MP3 to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 object put "linguaband-audio/practice/${TRACK_ID}/track.mp3" --file /tmp/audio/track.mp3 --remote --cache-control "public, max-age=31536000, immutable"

      - name: Verify MP3 reached remote R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bytes=$(npx wrangler r2 object get "linguaband-audio/practice/${TRACK_ID}/track.mp3" --remote --pipe | wc -c)
          if [ "$bytes" -eq 0 ]; then echo "FAILED: practice audio did not reach remote R2"; exit 1; fi
          echo "OK: practice audio (${bytes} bytes)"

      - name: Publish practice audio metadata to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: node scripts/d1-practice-write.mjs "$TRACK_ID" /tmp/audio/manifest.json

      - name: Mark practice audio as failed in D1
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: node scripts/d1-practice-status.mjs "$TRACK_ID" failed || echo "could not record the failure in D1"